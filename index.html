<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión Catastral TGI - Rufino</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f9;
      color: #333;
    }

    /* BARRA SUPERIOR */
    .barra-superior {
      height: 55px;
      background: #1a252f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 1001;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .logo-titulo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-titulo h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .controles-rapidos {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-barra {
      background: #34495e;
      color: white;
      border: 1px solid #455a64;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .btn-barra:hover {
      background: #455a64;
    }

    .btn-barra.activo {
      background: #2980b9;
      border-color: #3498db;
    }

    /* BOTÓN ESTILO AMARILLO FLÚOR */
    .btn-amarillo-fluor {
      background-color: #ffff00 !important;
      color: #000000 !important;
      font-weight: 700 !important;
      border: 2px solid #cccc00 !important;
      box-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
      transition: all 0.2s ease-in-out !important;
    }

    .btn-amarillo-fluor:hover {
      background-color: #ffff66 !important;
      box-shadow: 0 0 16px rgba(255, 255, 0, 0.95);
      transform: scale(1.03);
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor-principal {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      position: relative;
    }

    /* PANEL LATERAL */
    #panelLateral {
      width: 340px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 2px 0 10px rgba(0,0,0,0.15);
      transition: margin-left 0.3s ease;
    }

    #panelLateral.oculto {
      margin-left: -340px;
    }

    .header-panel {
      background: #2c3e50;
      color: #ffffff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-panel h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .contenido-panel {
      padding: 15px;
      overflow-y: auto;
      flex: 1;
    }

    .barra-herramientas {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    .btn-tool {
      width: 100%;
      padding: 9px 12px;
      background: #ecf0f1;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: #2c3e50;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-tool:hover {
      background: #e2e8f0;
    }

    .btn-tool.activo {
      background: #3498db;
      color: #ffffff;
      border-color: #2980b9;
    }

    .btn-accion {
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    .btn-accion:hover {
      background: #219150;
    }

    /* ACORDEONES */
    .grupo-acordeon {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #fff;
    }

    .cabecera-acordeon {
      background: #f8fafc;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .cuerpo-acordeon {
      display: none;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .grupo-acordeon.abierto .cuerpo-acordeon {
      display: block;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 4px;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: #3498db;
    }

    .contenedor-sugerencias {
      position: relative;
    }

    .lista-sugerencias {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 0 0 4px 4px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 2000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .item-sugerencia {
      padding: 8px 10px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
    }

    .item-sugerencia:hover {
      background: #e2e8f0;
    }

    /* BARRAS Y CAJAS INFORMATIVAS */
    #panelSeleccionMultiple {
      display: none;
      background: #e8f8f5;
      border: 1px solid #1abc9c;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .panel-info {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
    }

    .barra-progreso {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .progreso-llenado {
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    .etiqueta-porcentaje {
      font-size: 10px;
      font-weight: bold;
      color: #64748b;
    }

    /* MAPA */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }

    .btn-toggle-panel {
      background: #2c3e50;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-toggle-panel:hover {
      background: #34495e;
    }

    /* FICHA FLOTANTE */
    #panelFichaFlotante {
      display: none;
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 320px;
      max-height: 80vh;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }

    .cabecera-ficha {
      background: #2c3e50;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 13px;
    }

    .cuerpo-ficha {
      padding: 15px;
      overflow-y: auto;
      font-size: 12px;
    }

    .cuerpo-ficha p {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .cuerpo-ficha .etiqueta {
      color: #64748b;
      font-weight: 600;
    }

    .cuerpo-ficha .valor {
      font-weight: bold;
      color: #2c3e50;
    }

    .etiqueta-medida-lote {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #ffff00;
      color: #ffff00;
      font-weight: bold;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .deuda { color: #e74c3c; font-weight: bold; }
    .vencer { color: #f39c12; font-weight: bold; }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="barra-superior">
    <div class="logo-titulo">
      <button class="btn-toggle-panel" onclick="togglePanelLateral()">☰</button>
      <h1>Catastro TGI Rufino</h1>
    </div>

    <!-- BUSCADOR SUPERIOR -->
    <div style="display: flex; align-items: center; gap: 8px; position: relative;">
      <label for="inputBarraBusqueda" style="font-size: 12px; font-weight: bold; color: #ecf0f1; white-space: nowrap;">
        🔍 Buscar Titular / Padrón:
      </label>
      <div style="position: relative; width: 280px;">
        <input 
          type="text" 
          id="inputBarraBusqueda" 
          placeholder="Ingrese Apellido, Nombre o Padrón..." 
          autocomplete="off" 
          style="margin:0; background:#2c3e50; color:#fff; border: 1px solid #455a64; padding: 6px 10px; border-radius: 4px; width: 100%;" 
          oninput="ejecutarBusquedaBarra(this.value)" 
        />
        <div id="listaSugerenciasBarra" class="lista-sugerencias"></div>
      </div>
    </div>

    <!-- CONTROLES RÁPIDOS SUPERIORES -->
    <div class="controles-rapidos">
      <button id="btnToggleTGI" class="btn-barra activo">🗺️ TGI</button>
      <button id="btnToggleSatelite" class="btn-barra">🛰️ Satelital</button>
      <button id="btnToggleMuni" class="btn-barra">🏛️ Muni</button>
      <button id="btnSeleccionarSinDatosBarra" class="btn-barra btn-amarillo-fluor">
        ⚠️ Sin Datos: APAGADO
      </button>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="contenedor-principal">

    <!-- PANEL LATERAL -->
    <div id="panelLateral">
      <div class="header-panel">
        <h2>Herramientas y Filtros</h2>
      </div>

      <div class="contenido-panel">
        <!-- BOTONES PRINCIPALES -->
        <div class="barra-herramientas">
          <button id="btnToggleBaldios" class="btn-tool">⬜ Resaltar Baldíos: APAGADO</button>
          <button id="btnSeleccionarSinDatos" class="btn-tool btn-amarillo-fluor">⚠️ Sin Datos: APAGADO</button>
          <button id="btnToggleSeleccion" class="btn-tool">🔲 Selección Múltiple: OFF</button>
        </div>

        <!-- PANEL INFORMATIVO DE SELECCIÓN MÚLTIPLE -->
        <div id="panelSeleccionMultiple" style="display: none; flex-direction: column; align-items: stretch; gap: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span>Seleccionados: <strong id="lblCantSeleccionados">0</strong></span>
            <div style="display: flex; gap: 4px;">
              <button class="btn-barra" style="padding: 3px 6px; font-size: 10px;" onclick="imprimirLotesSeleccionados()">🖨️ Imprimir</button>
              <button class="btn-barra" style="padding: 3px 6px; font-size: 10px; background: #27ae60; border-color: #219150;" onclick="exportarExcelSeleccionados()">📊 Exportar Excel</button>
            </div>
          </div>
          <div id="listaSeleccionadosDetalle"></div>
        </div>

        <!-- TOTALIZADORES -->
        <div id="totalizadorBaldios" class="panel-info" style="display: none; background: #eef9f1; border-color: #2ecc71;">
          <p style="font-size: 12px; margin: 0; color: #27ae60; font-weight: bold;">
            🌱 Terrenos Baldíos: <span id="numBaldios">0</span>
          </p>
        </div>

        <div id="totalizadorSinDatos" class="panel-info" style="display: none; background: #ffffea; border-color: #cccc00;">
          <p style="font-size: 12px; margin: 0; color: #999900; font-weight: bold;">
            ⚠️ Lotes Sin Datos: <span id="numSinDatos">0</span>
          </p>
        </div>

        <!-- 1. ACORDEÓN: TITULAR / PADRÓN -->
        <div class="grupo-acordeon" id="grupoApellido">
          <div class="cabecera-acordeon" onclick="toggleAcordeon('grupoApellido')">
            <span>👤 Buscar por Titular / Padrón</span>
            <span class="icono-acordeon">►</span>
          </div>
          <div class="cuerpo-acordeon">
            <div class="contenedor-sugerencias">
              <input type="text" id="inputApellido" placeholder="Ej: Perez, Juan o Padrón..." autocomplete="off" />
              <div id="listaSugerencias" class="lista-sugerencias"></div>
            </div>
          </div>
        </div>

        <!-- 2. ACORDEÓN: CALLE -->
        <div class="grupo-acordeon" id="grupoCalle">
          <div class="cabecera-acordeon" onclick="toggleAcordeon('grupoCalle')">
            <span>KM Buscar por Calle</span>
            <span class="icono-acordeon">►</span>
          </div>
          <div class="cuerpo-acordeon">
            <div class="contenedor-sugerencias">
              <input type="text" id="inputCalle" placeholder="Nombre de la calle..." autocomplete="off" />
              <div id="listaSugerenciasCalle" class="lista-sugerencias"></div>
            </div>
            
            <!-- PANEL ESTADÍSTICA CALLE -->
            <div id="panelEstadisticaCalle" class="panel-info" style="display: none;">
              <div id="statsCalleContenido"></div>
              <div style="height: 120px; position: relative; margin-top: 8px;">
                <canvas id="graficoCalle"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. ACORDEÓN: SECCIÓN -->
        <div class="grupo-acordeon" id="grupoSeccion">
          <div class="cabecera-acordeon" onclick="toggleAcordeon('grupoSeccion')">
            <span>🧱 Filtrar por Sección</span>
            <span class="icono-acordeon">►</span>
          </div>
          <div class="cuerpo-acordeon">
            <select id="selectSeccion">
              <option value="">🧱 Seleccionar Sección...</option>
            </select>
          </div>
        </div>

        <!-- 4. ACORDEÓN: OBRAS PÚBLICAS -->
        <div class="grupo-acordeon" id="grupoObra">
          <div class="cabecera-acordeon" onclick="toggleAcordeon('grupoObra')">
            <span>🚧 Obras Públicas</span>
            <span class="icono-acordeon">►</span>
          </div>
          <div class="cuerpo-acordeon">
            <select id="selectObra">
              <option value="">🚧 Seleccionar Obra...</option>
            </select>

            <!-- PANEL ESTADÍSTICA OBRA -->
            <div id="panelEstadisticaObra" class="panel-info" style="display: none;">
              <div id="statsObraContenido"></div>
              <div style="height: 120px; position: relative; margin-top: 8px;">
                <canvas id="graficoObra"></canvas>
              </div>
              <button id="btnImprimirObra" class="btn-accion" style="display: none; font-size: 11px; padding: 6px;">
                🖨️ Imprimir Informe Obra
              </button>
            </div>
          </div>
        </div>

        <!-- 5. ESTADÍSTICA GENERAL -->
        <div style="margin-top: 15px;">
          <button class="btn-tool" onclick="solicitarGraficoGeneral()">📊 Graficar Estado General</button>
          <div id="contenedorGraficoGeneral" class="panel-info" style="display: none;">
            <div style="height: 150px; position: relative;">
              <canvas id="graficoBarras"></canvas>
            </div>
          </div>
        </div>

        <!-- BOTÓN IMPRIMIR MUNI -->
        <button class="btn-accion" style="background:#2980b9;" onclick="imprimirLotesMunicipales()">
          🏛️ Imprimir Terrenos Muni
        </button>

      </div>
    </div>

    <!-- MAPA PRINCIPAL -->
    <div id="map"></div>

  </div>

  <!-- FICHA FLOTANTE -->
  <div id="panelFichaFlotante">
    <div class="cabecera-ficha">
      <span>Ficha Catastral</span>
      <span style="cursor:pointer;" onclick="cerrarFicha()">✕</span>
    </div>
    <div id="cuerpoFichaContenido" class="cuerpo-ficha"></div>
  </div>

  <!-- LEAFLET JS Y CHART JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
