<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGI - Municipalidad de Rufino</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #f0f0f0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        /* BARRA SUPERIOR DE BÚSQUEDA */
        .barra-superior {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2000;
            background: white; padding: 10px 15px; display: flex; align-items: center; gap: 10px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        /* Botón de Menú Hamburguesa */
        .btn-hamburguesa {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #2c3e50;
            padding: 5px 10px; border-radius: 6px; transition: background 0.2s; display: flex; align-items: center;
        }
        .btn-hamburguesa:hover { background: #f0f2f5; }

        .contenedor-busquedas { display: flex; gap: 10px; flex: 1; position: relative; }
        .wrapper-input { flex: 1; position: relative; }

        /* MENÚ LATERAL HAMBURGUESA (SLIDEOUT PANEL) */
        .panel-lateral {
            position: absolute; top: 0; left: -320px; bottom: 0; width: 280px; z-index: 2500;
            background: white; padding: 20px; box-shadow: 4px 0 20px rgba(0,0,0,0.2);
            transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex; flex-direction: column; gap: 15px; max-height: 100vh; overflow-y: auto;
        }
        .panel-lateral.abierto { left: 0; }

        .header-panel-lateral { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .btn-cerrar-panel { background: none; border: none; font-size: 20px; cursor: pointer; color: #7f8c8d; }

        /* PANEL DERECHO (ESTADÍSTICAS GENERALES) */
        .panel-derecho {
            position: absolute; top: 75px; right: 10px; z-index: 1000;
            background: white; width: 280px; border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: all 0.3s ease;
        }
        .header-panel { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 2px solid #3498db; }
        .btn-toggle { background: none; border: none; font-size: 18px; cursor: pointer; color: #3498db; }
        .cuerpo-panel { padding: 15px; }

        /* inputs, selectores y contenedores de sugerencias */
        h2 { font-size: 12px; margin: 0; color: #2c3e50; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
        select { background-color: white; color: #2c3e50; cursor: pointer; }

        #listaSugerencias, #listaSugerenciasCalle { 
            position: absolute; top: 100%; left: 0; width: 100%; background: white; 
            border: 1px solid #ddd; border-radius: 0 0 6px 6px; max-height: 180px; 
            overflow-y: auto; display: none; z-index: 3000; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .item-sugerencia { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 11px; }
        .item-sugerencia:hover { background: #f8f9fa; color: #3498db; }

        /* Paneles de Análisis Dinámicos en el Menú Hamburguesa */
        #panelEstadisticaCalle { display: none; background: #f8f9fa; padding: 12px; border-radius: 10px; border-left: 5px solid #00fbff; }
        #panelEstadisticaObra { display: none; background: #f8f9fa; padding: 12px; border-radius: 10px; border-left: 5px solid #e67e22; position: relative; }

        .etiqueta-porcentaje { font-size: 10px; font-weight: bold; color: #7f8c8d; margin-top: 8px; display: block; }
        .barra-progreso { background: #ddd; border-radius: 4px; height: 8px; width: 100%; margin-top: 2px; overflow: hidden; }
        .progreso-llenado { height: 100%; transition: width 0.5s ease; }

        #contenidoFicha { display: none; border-top: 2px solid #3498db; padding-top: 10px; position: relative; font-size: 11px; }
        .btn-cerrar-ficha { position: absolute; top: 5px; right: 0; background: #e74c3c; color: white; border: none; width: 22px; height: 22px; cursor: pointer; border-radius: 4px; }
        
        .lote-calle-resaltada { stroke: #00fbff !important; stroke-width: 2px !important; stroke-opacity: 1 !important; fill-opacity: 0.4 !important; z-index: 1000 !important; }
        
        @keyframes parpadear { 0% { fill-opacity: 0.2; } 50% { fill-opacity: 1; } 100% { fill-opacity: 0.2; } }
        .lote-parpadeando { animation: parpadear 0.5s ease-in-out 5 !important; stroke: #ff00ff !important; stroke-width: 4px !important; z-index: 1500 !important; }
        
        .etiqueta { font-weight: bold; color: #7f8c8d; }
        .valor { color: #2c3e50; margin-left: 5px; }
        .deuda { color: #e74c3c; font-weight: bold; }
        .vencer { color: #f1c40f; font-weight: bold; }

        /* Botones Especiales */
        .btn-filtro-baldios {
            width: 100%; padding: 10px; border: 1px solid #ccc; background: #fff;
            color: #333; border-radius: 6px; cursor: pointer; font-weight: bold;
            font-size: 11px; text-align: left; transition: all 0.2s;
        }
        .btn-filtro-baldios.activo { background: #2ecc71; color: white; border-color: #27ae60; }

        .totalizador-baldios {
            display: none; background: #e8f8f5; border: 1px solid #2ecc71;
            padding: 10px; border-radius: 6px; font-size: 11px; color: #27ae60; font-weight: bold;
        }

        #btnImprimirObra {
            width: 100%; margin-top: 15px; padding: 10px; background: #d35400; color: white; 
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
            display: none; transition: background 0.3s;
        }
        #btnImprimirObra:hover { background: #e67e22; }
        .link-padron-modal { color: #3498db; text-decoration: underline; font-weight: bold; cursor: pointer; }

        @media print {
            #modalPrevisualizacion { position: absolute !important; top: 0 !important; left: 0 !important; background: white !important; z-index: 9999 !important; display: flex !important; height: auto !important; overflow: visible !important; }
            #modalPrevisualizacion > div { box-shadow: none !important; width: 100% !important; height: auto !important; overflow: visible !important; border-radius: 0 !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="barra-superior no-print">
        <button class="btn-hamburguesa" onclick="togglePanelLateral()" title="Abrir Filtros y Capas">☰</button>
        <div class="contenedor-busquedas">
            <div class="wrapper-input">
                <input type="text" id="inputApellido" placeholder="🔎 Buscar por Apellido o Nro. Padrón..." autocomplete="off">
                <div id="listaSugerencias"></div>
            </div>
            <div class="wrapper-input">
                <input type="text" id="inputCalle" placeholder="🛣️ Buscar por Nombre de Calle..." autocomplete="off">
                <div id="listaSugerenciasCalle"></div>
            </div>
        </div>
    </div>

    <div class="panel-lateral no-print" id="panelLateral">
        <div class="header-panel-lateral">
            <h2>Filtros y Capas</h2>
            <button class="btn-cerrar-panel" onclick="togglePanelLateral()">✕</button>
        </div>

        <select id="selectSeccion">
            <option value="">🧱 Seleccionar Sección...</option>
        </select>

        <select id="selectObra" style="border-color: #e67e22;">
            <option value="">🚧 Seleccionar Obra...</option>
        </select>
        
        <button id="btnToggleBaldios" class="btn-filtro-baldios">⬜ Resaltar Baldíos: APAGADO</button>
        <div id="totalizadorBaldios" class="totalizador-baldios">🟢 Total Terrenos Baldíos: <span id="numBaldios">0</span></div>

        <div id="contenidoFicha"></div>

        <div id="panelEstadisticaCalle">
            <h2 style="font-size: 11px; color: #16a085;">ANÁLISIS DE CALLE</h2>
            <div id="statsCalleContenido"></div>
            <div style="height: 120px; margin-top: 10px;">
                <canvas id="graficoCalle"></canvas>
            </div>
        </div>

        <div id="panelEstadisticaObra">
            <h2 style="font-size: 11px; color: #d35400;">INFORME DE OBRA PÚBLICA</h2>
            <div id="statsObraContenido"></div>
            <div style="height: 120px; margin-top: 10px;">
                <canvas id="graficoObra"></canvas>
            </div>
            <button id="btnImprimirObra">📄 Previsualizar Listado</button>
        </div>
    </div>

    <div class="panel-derecho no-print" id="panelD">
        <div class="header-panel">
            <h2>Estado TGI General</h2>
            <button class="btn-toggle" onclick="togglePanelDerecho()" id="btnT">➖</button>
        </div>
        <div class="cuerpo-panel" id="cuerpoD">
            <canvas id="graficoBarras" height="180"></canvas>
        </div>
    </div>

    <div id="map" class="no-print"></div>

    <div id="modalPrevisualizacion" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 3000; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 850px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.3);">
            <div style="padding: 15px 20px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center;" class="no-print">
                <h2 id="modalTituloObra" style="color: white; margin: 0; font-size: 13px;">Informe de Obra Pública</h2>
                <div style="display: flex; gap: 10px;">
                    <button onclick="window.print()" style="padding: 7px 14px; background: #d35400; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px;">🖨️ Imprimir</button>
                    <button onclick="cerrarModalObra()" style="padding: 7px 14px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px;">✕ Cerrar</button>
                </div>
            </div>
            <div style="flex: 1; padding: 25px; overflow-y: auto; font-size: 12px;">
                <div id="modalEncabezadoImpresion" style="margin-bottom: 15px; display: none;"></div>
                <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                    <thead>
                        <tr style="background: #f8f9fa;">
                            <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Nro. Padrón</th>
                            <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Titular</th>
                            <th style="border: 1px solid #ddd; padding: 8px; text-align: left;">Domicilio</th>
                            <th style="border: 1px solid #ddd; padding: 8px; text-align: center;">Cuotas Atr.</th>
                            <th style="border: 1px solid #ddd; padding: 8px; text-align: right;">Deuda Obra</th>
                        </tr>
                    </thead>
                    <tbody id="modalTablaCuerpo"></tbody>
                </table>
                <div id="modalTotalCaja" style="background: #fdf2e9; border: 1px solid #e67e22; padding: 15px; text-align: right; font-weight: bold; margin-top: 15px; border-radius: 6px;"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
